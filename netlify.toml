[build]
  publish = "public"
  command = "hugo -D"

[build.environment]
    HUGO_VERSION = "0.119.0"

[context.production.environment]
  HUGO_ENV           = "production"
  HUGO_ENABLEGITINFO = "true"

[context.split1]
  command = "hugo --config config.toml --gc --minify --enableGitInfo -D"

[context.split1.environment]
    HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --config config.toml --gc --minify --buildDrafts --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --config config.toml --gc --minify -b -D $DEPLOY_PRIME_URL"

[context.next.environment]
  HUGO_ENABLEGITINFO = "true"


